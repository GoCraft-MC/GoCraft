---
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'miniserv/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'miniserv/**'
env:
  GO_VERSION: ${{ vars.GO_VERSION || '1.24' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
