---
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'miniserv/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'miniserv/**'
env:
  GO_VERSION: ${{ vars.GO_VERSION || '1.24' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
