---
name: Validate PR
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
  pull-requests: read
env:
  GO_VERSION: ${{ vars.GO_VERSION || '1.24' }}
jobs:
  lint-title:
    name: Lint PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-commits:
    name: Lint commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Calculate Fetch Depth
        id: depth_calc
        run: |
          COMMITS=${{ github.event.pull_request.commits }}
          DEPTH=$((COMMITS + 1))
          echo "DEPTH=$DEPTH" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: ${{ steps.depth_calc.outputs.DEPTH }}
      - name: Conventional commit check
        uses: cocogitto/cocogitto-action@v4
        with:
          command: check

  lint-yaml:
    name: Lint YAML files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get changed YAML files
        id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.yaml
            **/*.yml
      - name: Lint YAML files
        if: ${{ steps.changed.outputs.any_changed == 'true' }}
        run: |
          yamllint ${{ steps.changed.outputs.all_changed_files }}

  lint-dockerfiles:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get changed YAML files
        id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*Dockerfile*
      - uses: hadolint/hadolint-action@v3.1.0
        if: ${{ steps.changed.outputs.any_changed == 'true' }}
        with:
          dockerfile: ${{ steps.changed.outputs.all_changed_files }}

  lint-markdown:
    name: Lint Markdown files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get changed Markdown files
        id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.md
      - name: Lint markdown files
        if: ${{ steps.changed.outputs.any_changed == 'true' }}
        uses: rvben/rumdl@v0
        with:
          path: ${{ steps.changed.outputs.all_changed_files }}

  lint-and-test-go:
    name: Lint and test Go sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get changed go files
        id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.go
      - uses: actions/setup-go@v7
        if: ${{ steps.changed.outputs.any_changed == 'true' }}
        with:
          go-version: ${{ env.GO_VERSION }}
          go-version-file: 'go.mod'
          token: ${{ github.token }}
          cache: true
          cache-dependency-path: 'go.sum'
      - name: golangci-lint
        if: ${{ steps.changed.outputs.any_changed == 'true' }}
        uses: golangci/golangci-lint-action@v6
      - name: go test
        if: ${{ steps.changed.outputs.any_changed == 'true' }}
        run: |
          go test \
            -v \
            -race \
            -covermode=atomic \
            ./...
