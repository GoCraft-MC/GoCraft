---
name: Label PRs
on:
  pull_request_target:
    types:
      - opened
      - synchronize
jobs:
  label:
    name: Label PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label PR
        uses: actions/labeler@v5
        with:
          configuration-path: .github/pr-labeler.yaml
          sync-labels: true
