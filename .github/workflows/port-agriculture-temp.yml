import "testing"

func TestPumpkinCropMoistureFactor(t *testing.T) {
    w := New(&FlatGenerator{}, nil, false)
    defer w.Close()
    w.SetBlock(0, 40, 0, Block{Namespace: "minecraft", Name: "farmland", Properties: map[string]string{"moisture": "7"}})
    w.SetBlock(0, 41, 0, Block{Namespace: "minecraft", Name: "wheat", Properties: map[string]string{"age": "0"}})
    if got := w.cropAvailableMoisture(0, 41, 0, "minecraft:wheat"); got != 4 {
        t.Fatalf("hydrated center farmland moisture factor = %v, want 4", got)
    }
    w.SetBlock(1, 40, 1, Block{Namespace: "minecraft", Name: "farmland", Properties: map[string]string{"moisture": "7"}})
    w.SetBlock(1, 41, 1, Block{Namespace: "minecraft", Name: "wheat", Properties: map[string]string{"age": "0"}})
    if got := w.cropAvailableMoisture(0, 41, 0, "minecraft:wheat"); got != 2.375 {
        t.Fatalf("diagonal crop moisture factor = %v, want 2.375", got)
    }
}

func TestPumpkinBoneMealRules(t *testing.T) {
    nether := Block{Namespace: "minecraft", Name: "nether_wart", Properties: map[string]string{"age": "0"}}
    if _, ok := ApplyCropBoneMeal(nether, 3); ok {
        t.Fatal("nether wart accepted bone meal, but Pumpkin does not implement nether-wart bonemeal")
    }

    beet := Block{Namespace: "minecraft", Name: "beetroots", Properties: map[string]string{"age": "0"}}
    grown, ok := ApplyCropBoneMeal(beet, 3) // (2 + 3) / 3 = 1
    if !ok || grown.Properties["age"] != "1" {
        t.Fatalf("beetroot bone meal = %#v, ok=%v; want age 1", grown, ok)
    }

    wheat := Block{Namespace: "minecraft", Name: "wheat", Properties: map[string]string{"age": "0"}}
    grown, ok = ApplyCropBoneMeal(wheat, 0)
    if !ok || grown.Properties["age"] != "2" {
        t.Fatalf("wheat bone meal = %#v, ok=%v; want age 2", grown, ok)
    }

    berry := Block{Namespace: "minecraft", Name: "sweet_berry_bush", Properties: map[string]string{"age": "1"}}
    grown, ok = ApplyCropBoneMeal(berry, 0)
    if !ok || grown.Properties["age"] != "2" {
        t.Fatalf("berry bone meal = %#v, ok=%v; want age 2", grown, ok)
    }

    torch := Block{Namespace: "minecraft", Name: "torchflower_crop", Properties: map[string]string{"age": "1"}}
    grown, ok = ApplyCropBoneMeal(torch, 0)
    if !ok || grown.ResourceLocation() != "minecraft:torchflower" {
        t.Fatalf("torchflower final bone meal = %#v, ok=%v; want torchflower", grown, ok)
    }
}

func TestPumpkinSweetBerryHarvest(t *testing.T) {
    bush := Block{Namespace: "minecraft", Name: "sweet_berry_bush", Properties: map[string]string{"age": "3"}}
    replacement, count, ok := HarvestSweetBerries(bush, 0)
    if !ok || replacement.Properties["age"] != "1" || count != 2 {
        t.Fatalf("harvest = %#v count=%d ok=%v; want age 1 and 2 berries", replacement, count, ok)
    }
}

func TestPumpkinStemGrowsFruitAndAttaches(t *testing.T) {
    w := New(&FlatGenerator{}, nil, false)
    defer w.Close()
    w.SetBlock(0, 40, 0, Block{Namespace: "minecraft", Name: "farmland", Properties: map[string]string{"moisture": "7"}})
    w.SetBlock(0, 41, 0, Block{Namespace: "minecraft", Name: "pumpkin_stem", Properties: map[string]string{"age": "7"}})
    for _, p := range [][2]int{{0, -1}, {0, 1}, {-1, 0}, {1, 0}} {
        w.SetBlock(p[0], 40, p[1], Block{Namespace: "minecraft", Name: "dirt"})
        w.SetBlock(p[0], 41, p[1], Air)
    }

    for tick := int64(20); tick <= 20000; tick += 20 {
        w.TickCrops(tick, 16)
        stem := w.GetBlock(0, 41, 0)
        if stem.ResourceLocation() == "minecraft:attached_pumpkin_stem" {
            facing := stem.Properties["facing"]
            dx, dz := 0, 0
            switch facing {
            case "north": dz = -1
            case "south": dz = 1
            case "west": dx = -1
            case "east": dx = 1
            default: t.Fatalf("invalid attached stem facing %q", facing)
            }
            if got := w.GetBlock(dx, 41, dz).ResourceLocation(); got != "minecraft:pumpkin" {
                t.Fatalf("attached stem points to %s, want pumpkin", got)
            }
            return
        }
    }
    t.Fatal("mature pumpkin stem never generated fruit")
}

func TestAttachedStemRevertsWhenFruitRemoved(t *testing.T) {
    w := New(&FlatGenerator{}, nil, false)
    defer w.Close()
    w.SetBlock(0, 40, 0, Block{Namespace: "minecraft", Name: "farmland", Properties: map[string]string{"moisture": "7"}})
    w.SetBlock(0, 41, 0, Block{Namespace: "minecraft", Name: "attached_pumpkin_stem", Properties: map[string]string{"facing": "east"}})
    w.SetBlock(1, 41, 0, Block{Namespace: "minecraft", Name: "pumpkin"})
    w.SetBlock(1, 41, 0, Air)
    stem := w.GetBlock(0, 41, 0)
    if stem.ResourceLocation() != "minecraft:pumpkin_stem" || stem.Properties["age"] != "7" {
        t.Fatalf("stem after pumpkin removal = %#v; want mature pumpkin_stem", stem)
    }
}
