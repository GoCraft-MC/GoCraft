name: Apply Pumpkin crop parity

on:
  push:
    branches: [feature/pumpkin-crop-parity]
    paths:
      - '.github/workflows/port-agriculture-temp.yml'

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pumpkin-crop-parity
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Apply crop parity port
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          world = Path('core/world/world.go')
          text = world.read_text()
          pattern = re.compile(r'// TickCrops advances.*?\nfunc \(w \*World\) TickCrops\(tick int64, maxChanges int\) \[\]BlockChange \{.*?\n\}\n\n(?=// TickFarmland applies)', re.S)
          replacement = '''// TickCrops advances loaded crops using Pumpkin's current crop rules.\n// The canonical simulation is shared by Java and Bedrock through SetBlock.\nfunc (w *World) TickCrops(tick int64, maxChanges int) []BlockChange {\n\treturn w.tickCropsPumpkin(tick, maxChanges)\n}\n\n'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'failed to replace TickCrops: {count}')

          marker = '''\t\t\t\tx := int(chunk.X)*SectionSize + localX\n\t\t\t\ty := SectionMinY(sectionIndex) + localY\n\t\t\t\tz := int(chunk.Z)*SectionSize + localZ\n\t\t\t\thash := uint64(int64(x)*0x9e3779b1)'''
          replacement_marker = '''\t\t\t\tx := int(chunk.X)*SectionSize + localX\n\t\t\t\ty := SectionMinY(sectionIndex) + localY\n\t\t\t\tz := int(chunk.Z)*SectionSize + localZ\n\t\t\t\t// Pumpkin farmland cannot remain below a solid block. Its Rust\n\t\t\t\t// implementation schedules the dirt conversion from the neighbour\n\t\t\t\t// update; this bounded farmland pass performs the same canonical change.\n\t\t\t\tif IsSolidLandingSurface(w.GetBlock(x, y+1, z).ResourceLocation()) {\n\t\t\t\t\tchanges = append(changes, BlockChange{X: x, Y: y, Z: z, Block: Block{Namespace: "minecraft", Name: "dirt"}})\n\t\t\t\t\tif len(changes) >= maxChanges {\n\t\t\t\t\t\tbreak\n\t\t\t\t\t}\n\t\t\t\t\tcontinue\n\t\t\t\t}\n\t\t\t\thash := uint64(int64(x)*0x9e3779b1)'''
          if marker not in text:
              raise SystemExit('failed to locate farmland coordinate marker')
          text = text.replace(marker, replacement_marker, 1)

          marker = '''\tw.notifyBlockObserver(x, y, z, block)\n}\n\n// setBlockNoPhysics'''
          replacement_marker = '''\tw.notifyBlockObserver(x, y, z, block)\n\tw.updateAttachedStemNeighbors(x, y, z)\n}\n\n// setBlockNoPhysics'''
          if marker not in text:
              raise SystemExit('failed to locate SetBlock observer marker')
          text = text.replace(marker, replacement_marker, 1)
          world.write_text(text)

          Path('core/world/crop_growth.go').write_text(r'''package world

import (
    "math"
    "strconv"
)

// tickCropsPumpkin translates Pumpkin's current CropBlockBase behaviour into
// GoCraft's canonical world model. Pumpkin currently has a TODO for crop light
// level checks too, so this intentionally does not invent a light requirement.
func (w *World) tickCropsPumpkin(tick int64, maxChanges int) []BlockChange {
    if w == nil || maxChanges <= 0 {
        return nil
    }
    w.mu.RLock()
    chunks := make([]*Chunk, 0, len(w.chunks))
    for _, chunk := range w.chunks {
        chunks = append(chunks, chunk)
    }
    w.mu.RUnlock()

    changes := make([]BlockChange, 0, maxChanges)
    for _, chunk := range chunks {
        for sectionIndex, section := range chunk.Sections {
            if section == nil || section.NonAir == 0 {
                continue
            }
            palette := section.BlockPalette()
            hasCrop := false
            for _, block := range palette {
                if isPumpkinTickCrop(block.ResourceLocation()) {
                    hasCrop = true
                    break
                }
            }
            if !hasCrop {
                continue
            }
            data := section.BlockData()
            for index, paletteIndex := range data {
                if int(paletteIndex) >= len(palette) {
                    continue
                }
                block := palette[paletteIndex]
                name := block.ResourceLocation()
                if !isPumpkinTickCrop(name) {
                    continue
                }
                age, err := strconv.Atoi(block.Properties["age"])
                if err != nil {
                    continue
                }
                localX := index % SectionSize
                localZ := (index / SectionSize) % SectionSize
                localY := index / (SectionSize * SectionSize)
                x := int(chunk.X)*SectionSize + localX
                y := SectionMinY(sectionIndex) + localY
                z := int(chunk.Z)*SectionSize + localZ
                roll := CropInteractionRoll(x, y, z, tick)

                switch name {
                case "minecraft:nether_wart":
                    // Pumpkin nether_wart.rs: age 0..3 and one growth chance in ten.
                    if age < 3 && roll%10 == 0 {
                        changes = append(changes, cropAgeChange(x, y, z, block, age+1))
                    }

                case "minecraft:sweet_berry_bush":
                    // Pumpkin sweet_berry_bush.rs: an outer 1/5 random gate,
                    // one stage at a time, and no growth into a solid block above.
                    if age < 3 && roll%5 == 0 && !cropGrowthObstructed(w.GetBlock(x, y+1, z)) {
                        changes = append(changes, cropAgeChange(x, y, z, block, age+1))
                    }

                case "minecraft:torchflower_crop":
                    // Pumpkin torch_flower.rs: 50% outer gate, then the shared
                    // moisture roll. Age 1 grows into the final torchflower block.
                    if age >= 2 || roll%2 == 0 {
                        break
                    }
                    roll = mixCropHash(roll)
                    if !cropMoistureGrowthSucceeds(w, x, y, z, name, roll) {
                        break
                    }
                    if age == 0 {
                        changes = append(changes, cropAgeChange(x, y, z, block, 1))
                    } else {
                        changes = append(changes, BlockChange{X: x, Y: y, Z: z, Block: Block{Namespace: "minecraft", Name: "torchflower"}})
                    }

                case "minecraft:beetroots":
                    // Pumpkin beetroot.rs only delegates one in three random ticks
                    // to CropBlockBase and caps at age 3.
                    if age < 3 && roll%3 == 0 {
                        roll = mixCropHash(roll)
                        if cropMoistureGrowthSucceeds(w, x, y, z, name, roll) {
                            changes = append(changes, cropAgeChange(x, y, z, block, age+1))
                        }
                    }

                case "minecraft:wheat", "minecraft:carrots", "minecraft:potatoes":
                    if age < 7 && cropMoistureGrowthSucceeds(w, x, y, z, name, roll) {
                        changes = append(changes, cropAgeChange(x, y, z, block, age+1))
                    }

                case "minecraft:pumpkin_stem", "minecraft:melon_stem":
                    if !cropMoistureGrowthSucceeds(w, x, y, z, name, roll) {
                        break
                    }
                    if age < 7 {
                        changes = append(changes, cropAgeChange(x, y, z, block, age+1))
                    } else if len(changes)+2 <= maxChanges {
                        changes = append(changes, w.growGourd(x, y, z, block, mixCropHash(roll))...)
                    }

                case "minecraft:cocoa":
                    // Cocoa is outside Pumpkin's CropBlockBase. Preserve GoCraft's
                    // previous bounded stage progression instead of regressing it.
                    if age < 2 && roll%5 == 0 {
                        changes = append(changes, cropAgeChange(x, y, z, block, age+1))
                    }

                case "minecraft:pitcher_crop":
                    // Pumpkin does not currently expose a pitcher-crop behaviour
                    // implementation to port. Keep GoCraft's existing 0..4 fallback.
                    if age < 4 && roll%5 == 0 {
                        changes = append(changes, cropAgeChange(x, y, z, block, age+1))
                    }
                }

                if len(changes) >= maxChanges {
                    break
                }
            }
            if len(changes) >= maxChanges {
                break
            }
        }
        if len(changes) >= maxChanges {
            break
        }
    }

    if len(changes) > maxChanges {
        changes = changes[:maxChanges]
    }
    for _, change := range changes {
        w.SetBlock(change.X, change.Y, change.Z, change.Block)
    }
    return changes
}

func isPumpkinTickCrop(name string) bool {
    switch name {
    case "minecraft:wheat", "minecraft:carrots", "minecraft:potatoes",
        "minecraft:beetroots", "minecraft:nether_wart", "minecraft:sweet_berry_bush",
        "minecraft:torchflower_crop", "minecraft:pumpkin_stem", "minecraft:melon_stem",
        "minecraft:cocoa", "minecraft:pitcher_crop":
        return true
    default:
        return false
    }
}

func cropAgeChange(x, y, z int, block Block, age int) BlockChange {
    replacement := copyWorldBlock(block)
    replacement.Properties["age"] = strconv.Itoa(age)
    return BlockChange{X: x, Y: y, Z: z, Block: replacement}
}

func cropMoistureGrowthSucceeds(w *World, x, y, z int, cropName string, roll uint64) bool {
    moisture := w.cropAvailableMoisture(x, y, z, cropName)
    if moisture <= 0 {
        moisture = 1
    }
    // Rust random_range(0..=floor(25/f)) has floor(25/f)+1 outcomes.
    outcomes := uint64(math.Floor(25.0/float64(moisture))) + 1
    return outcomes > 0 && roll%outcomes == 0
}

// cropAvailableMoisture is a direct translation of Pumpkin's
// get_available_moisture. The center farmland contributes 1 when dry or 3 when
// hydrated; the eight neighbours contribute one quarter of that value.
// Diagonal/crowded planting halves the resulting growth factor.
func (w *World) cropAvailableMoisture(x, y, z int, cropName string) float32 {
    moisture := float32(1)
    for dx := -1; dx <= 1; dx++ {
        for dz := -1; dz <= 1; dz++ {
            farmland := w.GetBlock(x+dx, y-1, z+dz)
            local := float32(0)
            if farmland.ResourceLocation() == "minecraft:farmland" {
                local = 1
                level, _ := strconv.Atoi(farmland.Properties["moisture"])
                if level != 0 {
                    local = 3
                }
            }
            if dx != 0 || dz != 0 {
                local /= 4
            }
            moisture += local
        }
    }

    same := func(dx, dz int) bool {
        return w.GetBlock(x+dx, y, z+dz).ResourceLocation() == cropName
    }
    horizontal := same(-1, 0) || same(1, 0)
    vertical := same(0, -1) || same(0, 1)
    if (horizontal && vertical) || same(-1, -1) || same(1, -1) || same(1, 1) || same(-1, 1) {
        moisture /= 2
    }
    return moisture
}

func cropGrowthObstructed(block Block) bool {
    return IsSolidLandingSurface(block.ResourceLocation())
}

// ApplyCropBoneMeal applies the crop-specific bonemeal rule shared by both
// protocol editions. Nether wart intentionally returns false: Pumpkin's Rust
// NetherWartBlock does not implement bonemeal behaviour.
func ApplyCropBoneMeal(target Block, roll uint64) (Block, bool) {
    name := target.ResourceLocation()
    age, err := strconv.Atoi(target.Properties["age"])
    if err != nil {
        return Block{}, false
    }
    replacement := copyWorldBlock(target)

    switch name {
    case "minecraft:wheat", "minecraft:carrots", "minecraft:potatoes",
        "minecraft:pumpkin_stem", "minecraft:melon_stem":
        if age >= 7 {
            return Block{}, false
        }
        increase := 2 + int(roll%4)
        replacement.Properties["age"] = strconv.Itoa(minInt(7, age+increase))
        return replacement, true

    case "minecraft:beetroots":
        if age >= 3 {
            return Block{}, false
        }
        // Pumpkin: random_range(2..=5) / 3, using integer division.
        increase := (2 + int(roll%4)) / 3
        replacement.Properties["age"] = strconv.Itoa(minInt(3, age+increase))
        return replacement, true

    case "minecraft:sweet_berry_bush":
        if age >= 3 {
            return Block{}, false
        }
        replacement.Properties["age"] = strconv.Itoa(age + 1)
        return replacement, true

    case "minecraft:torchflower_crop":
        if age <= 0 {
            replacement.Properties["age"] = "1"
            return replacement, true
        }
        if age == 1 {
            return Block{Namespace: "minecraft", Name: "torchflower"}, true
        }
        return Block{}, false

    case "minecraft:cocoa":
        if age >= 2 {
            return Block{}, false
        }
        replacement.Properties["age"] = strconv.Itoa(minInt(2, age+1))
        return replacement, true

    case "minecraft:pitcher_crop":
        // Preserve the previous GoCraft fallback until Pumpkin has a behaviour
        // implementation that can be translated exactly.
        if age >= 4 {
            return Block{}, false
        }
        replacement.Properties["age"] = strconv.Itoa(minInt(4, age+1))
        return replacement, true
    }
    return Block{}, false
}

// HarvestSweetBerries translates Pumpkin's normal_use implementation. Ages 2
// and 3 reset to age 1 and yield age-1..age berries respectively.
func HarvestSweetBerries(target Block, roll uint64) (Block, int, bool) {
    if target.ResourceLocation() != "minecraft:sweet_berry_bush" {
        return Block{}, 0, false
    }
    age, err := strconv.Atoi(target.Properties["age"])
    if err != nil || (age != 2 && age != 3) {
        return Block{}, 0, false
    }
    replacement := copyWorldBlock(target)
    replacement.Properties["age"] = "1"
    count := age - 1 + int(roll%2)
    return replacement, count, true
}

// SupportsVegetation approximates Minecraft's supports_vegetation tag for the
// crop interactions ported here. It is intentionally conservative.
func SupportsVegetation(name string) bool {
    switch name {
    case "minecraft:grass_block", "minecraft:dirt", "minecraft:coarse_dirt",
        "minecraft:podzol", "minecraft:farmland", "minecraft:rooted_dirt",
        "minecraft:moss_block", "minecraft:mud", "minecraft:mycelium":
        return true
    default:
        return false
    }
}

func (w *World) growGourd(x, y, z int, stem Block, roll uint64) []BlockChange {
    dirs := [...]struct {
        dx, dz int
        facing string
    }{
        {0, -1, "north"},
        {0, 1, "south"},
        {-1, 0, "west"},
        {1, 0, "east"},
    }
    dir := dirs[int(roll%uint64(len(dirs)))]
    fruitX, fruitZ := x+dir.dx, z+dir.dz
    if !w.GetBlock(fruitX, y, fruitZ).IsAir() || !supportsGourdFruit(w.GetBlock(fruitX, y-1, fruitZ).ResourceLocation()) {
        return nil
    }

    fruit := "melon"
    attached := "attached_melon_stem"
    if stem.ResourceLocation() == "minecraft:pumpkin_stem" {
        fruit = "pumpkin"
        attached = "attached_pumpkin_stem"
    }
    return []BlockChange{
        {X: fruitX, Y: y, Z: fruitZ, Block: Block{Namespace: "minecraft", Name: fruit}},
        {X: x, Y: y, Z: z, Block: Block{Namespace: "minecraft", Name: attached, Properties: map[string]string{"facing": dir.facing}}},
    }
}

func supportsGourdFruit(name string) bool {
    switch name {
    case "minecraft:farmland", "minecraft:dirt", "minecraft:grass_block", "minecraft:coarse_dirt",
        "minecraft:podzol", "minecraft:mycelium", "minecraft:rooted_dirt", "minecraft:mud",
        "minecraft:muddy_mangrove_roots":
        return true
    default:
        return false
    }
}

// updateAttachedStemNeighbors mirrors Pumpkin's attached_stem.rs neighbour
// update: removing the fruit in front of an attached stem turns it back into a
// mature normal stem (age 7).
func (w *World) updateAttachedStemNeighbors(changedX, changedY, changedZ int) {
    if w == nil {
        return
    }
    neighbors := [...]struct {
        x, z int
        facing string
    }{
        {changedX, changedZ + 1, "north"},
        {changedX, changedZ - 1, "south"},
        {changedX + 1, changedZ, "west"},
        {changedX - 1, changedZ, "east"},
    }
    for _, pos := range neighbors {
        stem := w.GetBlock(pos.x, changedY, pos.z)
        stemName := stem.ResourceLocation()
        if (stemName != "minecraft:attached_pumpkin_stem" && stemName != "minecraft:attached_melon_stem") || stem.Properties["facing"] != pos.facing {
            continue
        }
        expectedFruit := "minecraft:melon"
        normalStem := "melon_stem"
        if stemName == "minecraft:attached_pumpkin_stem" {
            expectedFruit = "minecraft:pumpkin"
            normalStem = "pumpkin_stem"
        }
        if w.GetBlock(changedX, changedY, changedZ).ResourceLocation() == expectedFruit {
            continue
        }
        w.SetBlock(pos.x, changedY, pos.z, Block{Namespace: "minecraft", Name: normalStem, Properties: map[string]string{"age": "7"}})
    }
}

// CropInteractionRoll gives adapters a stable seed for interaction behaviour
// without duplicating hashing logic.
func CropInteractionRoll(x, y, z int, tick int64) uint64 {
    h := uint64(int64(x))*0x9e3779b185ebca87 ^ uint64(int64(y))*0xc2b2ae3d27d4eb4f ^
        uint64(int64(z))*0x165667b19e3779f9 ^ uint64(tick+1)*0x27d4eb2f165667c5
    return mixCropHash(h)
}

func mixCropHash(h uint64) uint64 {
    h ^= h >> 33
    h *= 0xff51afd7ed558ccd
    h ^= h >> 33
    h *= 0xc4ceb9fe1a85ec53
    h ^= h >> 33
    return h
}

func minInt(a, b int) int {
    if a < b {
        return a
    }
    return b
}
