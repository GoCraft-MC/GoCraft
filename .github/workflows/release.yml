name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build Linux amd64 binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o gocraft-linux-amd64 \
            .

      - name: Build Windows amd64 binary
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o gocraft-windows-amd64.exe \
            .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GoCraft ${{ github.ref_name }} — Experimental Dev Build
          prerelease: true
          files: |
            gocraft-linux-amd64
            gocraft-windows-amd64.exe
          generate_release_notes: true
