---
name: Release GoCraft
on:
  push:
    tags:
      - "v*"
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/gocraft
  GO_VERSION: ${{ vars.GO_VERSION || '1.24' }}
permissions:
  contents: write
  pull-requests: write
  packages: write
jobs:
  release-gocraft:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
            ext: ""
          - runner: windows-latest
            os: windows
            arch: amd64
            ext: ".exe"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o gocraft-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} \
            .
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GoCraft ${{ github.ref_name }} — Experimental Dev Build
          prerelease: true
          files: |
            gocraft-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
          generate_release_notes: true
