# Code generation for the plugin ABI.
#
# Generated files are committed, so neither CI nor a contributor needs buf or
# protoc-gen-go to build the server. `buf generate` regenerates them; CI can
# verify that doing so leaves no diff.
#
# Every schema here is generated. A schema that is parsed by hand somewhere else
# is a second definition of the same format, free to drift from this one without
# anything noticing — which is the failure `buf breaking` exists to prevent.
# Generated types stay at the wire boundary: packages convert them into their
# own neutral types rather than passing them around.
version: v2

plugins:
  - local: protoc-gen-go
    out: .
    opt: module=GoCraft