---
services:
  gocraft:
    image: ghcr.io/gocraft-mc/gocraft:latest
    build:
      context: .
      dockerfile: docker/gocraft/Dockerfile
    container_name: gocraft
    ports:
      - "25565:25565/tcp"
      - "19106:19106/udp"
    volumes:
      - ./data:/data
    environment:
      GOCRAFT_MOTD: "Mon serveur"
      GOCRAFT_MAX_PLAYERS: "100"
      GOCRAFT_ONLINE_MODE: "false"
      GOCRAFT_DIFFICULTY: "hard"
      # GOCRAFT_BEDROCK_ENABLED: "true"
      # GOCRAFT_HEALTHCHECK_PORT: "8080"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/gocraft", "--check-health"]
      interval: 30s
      timeout: 5s
      retries: 5
