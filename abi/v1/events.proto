syntax = "proto3";

package gocraft.abi.v1;

import "abi/v1/options.proto";

option go_package = "GoCraft/abi/v1/wire;wire";
option java_package = "fr.gocraft.abi.v1";
option java_outer_classname = "EventsProto";
option java_multiple_files = true;

// Native events, declared once.
//
// Writing each of these by hand would mean writing it four times — Go, Java,
// Lua, docs — and watching all four drift by month three. protoc-gen-gocraft
// reads this file and emits every side from it, in one commit, which is what
// makes "a Lua event and a Java event come out of the same source" true rather
// than aspirational.
//
// **These messages are never serialised.** The envelope carries an event as a
// type name and a positional list of Values (§20.4), because a wire format that
// carried field names would have to agree on them across every language and
// would break every runtime the day one was renamed. What this file declares is
// the *layout*: field 1 is at index 0, field 2 at index 1, and the generator
// emits named accessors over that agreement on both sides. Declaration order is
// therefore load-bearing — reordering fields is a wire break even though
// nothing here moves.

// ── Vocabulary ────────────────────────────────────────────────────────────────
//
// The types events are built from. Hand-written in each language, where
// ergonomics matter and generated code would be mediocre; declared here so the
// generator knows how to read one out of a positional payload.

message PlayerRef {
  bytes uuid = 1;
  string username = 2;
  // "java" or "bedrock". A plugin should rarely care, and the one place it
  // does is deciding what a client can render.
  string edition = 3;
}

message BlockPos {
  sint64 x = 1;
  sint64 y = 2;
  sint64 z = 3;
}

message Block {
  // Namespaced, as the registries spell it: "minecraft:oak_stairs".
  string id = 1;
  // The full state rather than a handle to re-resolve. A handler that had to
  // ask the server what it was just given would pay a round trip inside an
  // event that is blocking the tick.
  map<string, string> properties = 2;
}

// ── Events ────────────────────────────────────────────────────────────────────

message BlockBreak {
  option (gocraft.abi.v1.event) = {
    type: "block.break"
    cancellable: true
    phase: PHASE_TICK_BLOCKING
    on_failure: FAILURE_POLICY_ALLOW
    effects: ["message"]
    since: 1
  };

  PlayerRef player = 1;
  BlockPos pos = 2;
  Block block = 3;
  // The item in hand, namespaced. Empty when breaking bare-handed.
  string tool = 4;
  // Resolved by the host before dispatch, for every node the manifest
  // subscribed to. A handler asking about one never pays a round trip — which
  // matters because it is holding the tick while it asks.
  map<string, bool> perms = 5 [(gocraft.abi.v1.injected) = true];
}

message PlayerJoin {
  option (gocraft.abi.v1.event) = {
    type: "player.join"
    cancellable: false
    phase: PHASE_OBSERVATIONAL
    on_failure: FAILURE_POLICY_ALLOW
    effects: ["message"]
    since: 1
  };

  PlayerRef player = 1;
  map<string, bool> perms = 2 [(gocraft.abi.v1.injected) = true];
}