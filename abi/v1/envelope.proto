syntax = "proto3";

package gocraft.abi.v1;

// Generated Go code lives in its own package. abi/v1 holds the hand-written
// domain types the bus, the mutation queue and the in-process runtimes use on
// the hot path; wire types stay at the transport boundary and are converted in,
// never passed around.
option go_package = "GoCraft/abi/v1/wire;wire";

// Java options are set before any Java code exists. They decide the package and
// the outer class of the generated sources, so choosing them later would rename
// every type the runtime imports — source-breaking for a consumer that would by
// then exist. The wire format does not depend on any of them.
option java_package = "fr.gocraft.abi.v1";
option java_outer_classname = "EnvelopeProto";
option java_multiple_files = true;

// Envelope is every message exchanged between the host and an out-of-process
// runtime. One frame carries exactly one envelope.
//
// seq correlates a reply with its request: the host registers a pending seq
// before writing and the runtime echoes it back. Messages the host does not
// wait on (READY, SHUTDOWN) may leave it at zero.
message Envelope {
  uint64 seq = 1;

  oneof body {
    // Handshake. The runtime speaks first, so a version mismatch is caught
    // before the host sends anything it would have to take back.
    Hello hello = 2;
    Welcome welcome = 3;

    // Plugin lifecycle. LOAD is sequential because load order is derived from
    // the dependency graph and a plugin may rely on an earlier one.
    Load load = 4;
    Loaded loaded = 5;
    Fail fail = 6;
    Ready ready = 7;
    Unload unload = 8;

    // Event dispatch, the hot path.
    Dispatch dispatch = 9;
    Verdict verdict = 10;

    // Liveness. Three missed pongs mean the runtime is killed and respawned.
    Ping ping = 11;
    Pong pong = 12;

    Shutdown shutdown = 13;
  }

  // 14 onward are free for command invocation, service calls and host-call
  // results. They are left undesigned rather than half-specified: adding a
  // variant to a oneof is backward compatible, changing one is not.
}

// Hello announces the runtime and the ABI it was built against. A mismatch
// makes the runtime exit rather than negotiate: a runtime that guesses is worse
// than one that refuses.
message Hello {
  uint32 abi = 1;
  // Human-readable, for logs only. Never parsed. e.g. "jvm 25.0.3".
  string runtime = 2;
}

// Welcome carries the host facts a runtime needs before any plugin starts.
message Welcome {
  uint32 abi = 1;
  uint32 tick_rate = 2;
  // The shared budget for one cancellable event across all of its subscribers.
  // The runtime cannot enforce it, but it can log when it overruns.
  uint32 event_budget_ms = 3;
}

// Load asks the runtime to bring up one plugin from an already validated
// bundle. The host has read the manifest; the runtime is told where the bundle
// is, not asked to discover it.
message Load {
  string plugin_id = 1;
  string bundle_path = 2;
  string entry = 3;

  // Where this plugin's own files live: its configuration, unpacked from the
  // bundle's config/ on first load, and anything it writes for itself.
  //
  // The host owns it. It creates the directory, seeds the defaults and never
  // overwrites what an admin edited, so a runtime is told the path rather than
  // deriving one — two runtimes deriving it separately would eventually derive
  // it differently.
  //
  // Added in ABI 1 after the fact: a runtime built before this reads an empty
  // string, which is why nothing may assume it is set.
  string data_directory = 4;
}

// Loaded reports what the plugin actually registered, which the host checks
// against the manifest it validated. A plugin that subscribes to an event it
// never declared is a bug, not a feature.
message Loaded {
  string plugin_id = 1;
  repeated string events = 2;
}

// Fail rejects one plugin without bringing the runtime down. Per-plugin failure
// is what makes an external runtime tolerable to operate.
message Fail {
  string plugin_id = 1;
  // Meant to be shown to an admin verbatim, e.g. "config.yml:12 taxRate < 0".
  string reason = 2;
}

// Ready ends the load phase. The host opens its listeners only after this.
message Ready {}

message Unload {
  string plugin_id = 1;
}

// Dispatch delivers one event to one plugin. The host, not the runtime, decides
// who receives what and in which order, because subscription order and the
// shared budget are host concerns.
message Dispatch {
  string plugin_id = 1;
  Event event = 2;
}

message Ping {}

message Pong {}

// Shutdown asks for an orderly stop. The host still kills the process if it
// does not exit within its window.
message Shutdown {}

// FailurePolicy decides a cancellable event when a subscriber fails to reply in
// time. It travels with the event so the runtime can answer correctly even if
// the host has already stopped waiting.
enum FailurePolicy {
  FAILURE_POLICY_UNSPECIFIED = 0;
  FAILURE_POLICY_ALLOW = 1;
  FAILURE_POLICY_DENY = 2;
}

// Value is the positional value carried by events, verdicts and host calls.
//
// Positional rather than named: field names would have to match across every
// language, and renaming one would break every runtime at once. The layout is
// declared in the manifest, so both sides agree on what index 3 means without
// the wire format carrying that agreement on every event.
message Value {
  oneof kind {
    bool bool_value = 1;
    int64 int64_value = 2;
    double double_value = 3;
    string string_value = 4;
    bytes bytes_value = 5;
    // A oneof cannot hold a repeated field, hence the wrapper.
    ValueList list_value = 6;
  }
}

message ValueList {
  repeated Value values = 1;
}

// Event is the generic envelope used for both native and plugin-defined events.
// One shape for all of them means a new event costs a manifest entry, not a
// change to this schema.
message Event {
  string type = 1;
  // Negotiated at load time for plugin-defined events, so the type string is
  // not re-sent on every dispatch. Zero for native events.
  uint32 type_id = 2;
  repeated Value fields = 3;
  FailurePolicy on_failure = 4;
}

// Mutation replaces the value at a positional path after a subscriber runs.
// The path indexes into the event fields, so a nested value is addressed
// without the plugin sending the whole event back.
message Mutation {
  repeated uint32 path = 1;
  Value value = 2;
}

// HostCall is a protocol-neutral request for a mutation or side effect. Writes
// never originate from a plugin directly: the host queues these and the
// simulation tick applies them.
message HostCall {
  string type = 1;
  repeated Value fields = 2;
}

// Verdict is one subscriber's answer to one event.
message Verdict {
  bool cancelled = 1;
  repeated Mutation mutations = 2;
  repeated HostCall effects = 3;
}