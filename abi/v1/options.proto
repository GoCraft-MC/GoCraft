syntax = "proto3";

package gocraft.abi.v1;

import "google/protobuf/descriptor.proto";
import "abi/v1/envelope.proto";

option go_package = "GoCraft/abi/v1/wire;wire";
option java_package = "fr.gocraft.abi.v1";
option java_outer_classname = "OptionsProto";
option java_multiple_files = true;

// A plain .proto describes fields, not semantics. Whether an event can be
// cancelled, whether the tick waits for it, and what happens when nobody
// answers are the things a generator has to know and a field list cannot say.
//
// They live here as a custom option rather than as a convention, so the
// generator reads them from the schema instead of from a table beside it that
// nothing keeps in step.
extend google.protobuf.MessageOptions {
  EventOptions event = 50001;
}

// Marks a field the host fills in before dispatch rather than one describing
// what happened.
//
// Today that is the resolved permission map: the host answers every node the
// manifest subscribed to and ships the answers inside the event, so a handler
// never pays a round trip to ask — which it cannot afford, holding the tick.
//
// The generator treats these differently on both sides: they are not
// constructor arguments a caller supplies, and on the plugin side they surface
// as a query method rather than as a map to rummage through.
extend google.protobuf.FieldOptions {
  bool injected = 50002;
}

message EventOptions {
  // The name the manifest subscribes to, and the only identity that crosses
  // the wire for a native event: "block.break", "player.join".
  string type = 1;

  // Whether a subscriber can prevent it. A cancellable event blocks the tick;
  // an observational one is fire-and-forget.
  bool cancellable = 2;

  Phase phase = 3;

  // What the event resolves to when a subscriber fails to answer in time. It
  // travels with the event so a runtime can answer correctly even after the
  // host has stopped waiting.
  //
  // Reused from envelope.proto rather than redeclared: proto3 scopes enum
  // values to the package, not the enum, so a second FailurePolicy here would
  // not merely risk drifting from that one — it would fail to compile against
  // it.
  FailurePolicy on_failure = 4;

  // Side effects a handler may request, batched into the verdict rather than
  // sent one at a time — which is what keeps one event to one round trip.
  // Only the effects named here appear on the generated event class.
  repeated string effects = 5;

  // The ABI version that introduced this event. The generator emits it, and a
  // runtime built against an older ABI refuses to load the plugin with a
  // message rather than failing on first dispatch.
  uint32 since = 6;
}

enum Phase {
  PHASE_UNSPECIFIED = 0;

  // The tick waits for every subscriber, under one budget shared by all of
  // them. This is what lets a plugin prevent something.
  PHASE_TICK_BLOCKING = 1;

  // Dispatched and forgotten. The tick never waits, so a slow subscriber costs
  // nothing and cancelling means nothing.
  PHASE_OBSERVATIONAL = 2;
}